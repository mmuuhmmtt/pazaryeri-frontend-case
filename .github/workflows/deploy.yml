name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          GITHUB_ACTIONS: true
          NODE_ENV: production

      - name: Verify output directory
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found after build"
            ls -la
            exit 1
          fi
          echo "✓ Output directory found"
          ls -la out | head -20

      - name: Create root redirect
        run: |
          # Root path için redirect HTML oluştur
          REPO_NAME="${{ github.event.repository.name }}"
          cat > out/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <meta http-equiv="refresh" content="0; url=/$REPO_NAME/tr">
              <link rel="canonical" href="/$REPO_NAME/tr">
              <script>
                  window.location.replace('/$REPO_NAME/tr');
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/$REPO_NAME/tr">/tr</a>...</p>
          </body>
          </html>
          EOF
          echo "✓ Root redirect created"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

